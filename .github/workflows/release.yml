name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.0 chardet==5.2.0
      - name: Tests
        run: python -m unittest discover -v
      - name: Build app and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean LineReader.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          $process = Start-Process -FilePath dist\LineReader\LineReader.exe -ArgumentList '--smoke-test --smoke-log smoke-test.log' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content smoke-test.log; throw 'Smoke test failed' }
          if (-not (Select-String -Path smoke-test.log -Pattern '^PASS$' -Quiet)) { throw 'Missing PASS marker' }
          $version = python -c "from app_info import VERSION; print(VERSION)"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Version/tag mismatch' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\LineReader.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Copy-Item "output\LineReader-Setup-$version.exe" output\LineReader-Setup.exe
          $hash = (Get-FileHash output\LineReader-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LineReader-Setup.exe" | Set-Content output\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: LineReader-Windows
          path: output/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" output/LineReader-Setup.exe output/SHA256SUMS.txt --generate-notes --title "LineReader ${{ github.ref_name }}"
